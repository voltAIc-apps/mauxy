apiVersion: apps/v1
kind: Deployment
metadata:
  name: mauxy
  namespace: ${DEPLOY_NAMESPACE}
  labels:
    app.kubernetes.io/name: mauxy
spec:
  replicas: 1
  # Recreate, never RollingUpdate: ONE ReadWriteOnce PVC (Longhorn) holds the SQLite DB, and the
  # outbox / jobs run in-process. A surge pod could not mount the volume (or would write the same
  # SQLite file twice). Short downtime per rollout is accepted.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mauxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mauxy
    spec:
      imagePullSecrets:
        - name: ${DEPLOY_IMAGE_PULL_SECRET}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mauxy-data
      # Deployer's schema-apply step: run pending db-patches/ against the PVC DB before the
      # app starts. Idempotent (records applied patches); first boot creates the schema.
      initContainers:
        - name: migrate
          image: ${DEPLOY_IMAGE}
          imagePullPolicy: Always
          command: ["python", "scripts/sqlite_db.py", "--migrate"]
          envFrom:
            - secretRef:
                name: mauxy-credentials
          volumeMounts:
            - name: data
              mountPath: /data
      containers:
        - name: mauxy
          image: ${DEPLOY_IMAGE}
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: mauxy-credentials
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              memory: "48Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "100m"
          # Liveness hits /health (Mautic-independent: only restarts a wedged process).
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness hits /ready (local only: the SQLite DB answers; NOT tied to a sink, every
          # endpoint degrades gracefully while erp.wapsol / Mautic is down).
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
